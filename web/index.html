<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextOne ERP</title>
    <!-- Font Inter untuk Portal Pelanggan. Dimuat non-blocking (media=print → all);
         file font hanya diunduh browser di halaman yang memakai 'Inter'. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
    <style>
      /* Layar pembuka — tampil seketika sebelum aplikasi selesai dimuat */
      #pembuka { position: fixed; inset: 0; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f1f5f9; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .3s ease; }
      #pembuka.pergi { opacity: 0; pointer-events: none; }
      #pembuka .pb-logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #1e40af, #2563eb 60%, #22d3ee); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: -.5px; box-shadow: 0 12px 30px rgba(37, 99, 235, .35); animation: pb-napas 1.6s ease-in-out infinite; }
      #pembuka .pb-nama { font-size: 14px; font-weight: 700; color: #0f172a; letter-spacing: .2px; }
      #pembuka .pb-rel { width: 140px; height: 3px; border-radius: 3px; background: #e2e8f0; overflow: hidden; }
      #pembuka .pb-rel::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #2563eb, #22d3ee); animation: pb-geser 1.1s ease-in-out infinite; }
      #pembuka .pb-ket { font-size: 12.5px; color: #64748b; min-height: 18px; text-align: center; padding: 0 20px; }
      #pembuka .pb-ket a { color: #1d4ed8; font-weight: 600; }
      @keyframes pb-geser { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
      @keyframes pb-napas { 50% { transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { #pembuka .pb-logo, #pembuka .pb-rel::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="pembuka" role="status" aria-label="Memuat aplikasi">
      <div class="pb-logo">N1</div>
      <div class="pb-nama">NextOne ERP</div>
      <div class="pb-rel"></div>
      <div class="pb-ket" id="pembuka-ket">Menyiapkan aplikasi…</div>
    </div>
    <script>
      // Bila aplikasi tak kunjung terbuka (koneksi lambat / berkas gagal dimuat), beri jalan keluar
      setTimeout(function () {
        var k = document.getElementById('pembuka-ket')
        if (k) k.innerHTML = 'Koneksi lambat atau aplikasi gagal dimuat. <a href="javascript:location.reload()">Muat ulang</a>'
      }, 12000)
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
